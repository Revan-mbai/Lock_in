<!doctype html>
<html lang="en">
  <head>
    <!-- The vite console-error shield is injected by hmrCompatPlugin in vite.config.ts.
         Do not inline a second copy here — it would run twice on every page load. -->
    <meta charset="UTF-8" />
    <script>
      // Runs before the first paint so the page never flashes the wrong theme. Resolves the
      // stored choice, falling back to the OS setting, and stamps data-theme on <html>. Because
      // the attribute is always present, src/index.css needs only one dark palette rather than a
      // second copy inside a prefers-color-scheme query.
      (function () {
        try {
          var stored = localStorage.getItem('study_methods_theme_v1');
          var dark = stored === null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored === 'dark';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock In - Focus & Break Suite</title>
    <meta name="description" content="A warm, minimalistic study suite with automated focus and break timers for Pomodoro, Flowtime, 90-Minute Cycles, Time Boxing, the 52/17 Rule, Retrieval Practice, Interleaved Practice and the Feynman Technique." />
    <meta property="og:title" content="Lock In - Focus & Break Suite" />
    <meta property="og:description" content="A warm, minimalistic study suite with automated focus and break timers for Pomodoro, Flowtime, 90-Minute Cycles, Time Boxing, the 52/17 Rule, Retrieval Practice, Interleaved Practice and the Feynman Technique." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="var(--color-canvas)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lock In" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <!-- The web app manifest link is injected by vite-plugin-pwa (/manifest.webmanifest).
         Do not add a second <link rel="manifest"> here — browsers honour only the first,
         which would shadow the generated one. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-canvas text-ink-body antialiased selection:bg-selection selection:text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
